name: Build Android APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Generate fixed debug keystore and print SHA-1
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -startdate "2026/01/01 00:00:00" -dname "CN=Android Debug,O=Android,C=US"
          echo "==================== COPY THIS SHA-1 ===================="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
          echo "==========================================================="
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Assemble Debug APK
        run: gradle assembleDebug --no-daemon -Pksp.incremental=false
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Focus-Zohayr-APK
          path: app/build/outputs/apk/debug/*.apk
          
